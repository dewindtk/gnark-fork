<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title desc">
<title id="title">Witness mask: same values on the hypercube, random elsewhere</title>
<desc id="desc">Real-number illustration: w(t)=2+3t and masked versions w(t)+c*t*(1-t) for c=-6, 4, 9. All agree at t=0 and t=1 (the hypercube), and differ at the random point t=rho1.</desc>
