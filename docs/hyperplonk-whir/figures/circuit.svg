<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="title desc">
<title id="title">Toy circuit x² + x + 5 = out as a HyperPlonk table with its copy cycles</title>
<desc id="desc">Four rows: public placeholder, x*x=v1, v1+x=v2, v2+5=out. The permutation sigma links every cell holding the same variable into a cycle; the animation highlights the cycles of out, x, v1 and v2 in turn.</desc>
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#9a9993;--grid:#e4e3df;--cell:#f0efec;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--bad:#d03b3b;--good:#0ca30c;--t1:rgba(42,120,214,.16);--t2:rgba(235,104,52,.16)}
@media (prefers-color-scheme:dark){svg{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#77766f;--grid:#383835;
--cell:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--bad:#e66767;--good:#0ca30c;--t1:rgba(57,135,229,.22);--t2:rgba(217,89,38,.22)}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink);
font-variant-numeric:tabular-nums}
.t2{fill:var(--ink2)} .sm{font-size:11.5px} .lg{font-size:15px;font-weight:600} .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.cell{fill:var(--cell);stroke:var(--grid);stroke-width:1}
.line{stroke:var(--muted);stroke-width:1.2;fill:none} .dash{stroke-dasharray:4 4}
.rv,.tr{animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}
.tr{opacity:0}
@media (prefers-reduced-motion:reduce){svg .rv,svg .tr{animation:none!important}svg .rv{opacity:1}svg .tr{opacity:0}svg .keep{opacity:1}}
@keyframes tr0_1{0%,0.0%{opacity:0}1.5%,16.5%{opacity:1}18.0%,100%{opacity:0}}.tr0_1{animation-name:tr0_1;animation-duration:16s}@keyframes tr1_1{0%,18.0%{opacity:0}19.5%,34.5%{opacity:1}36.0%,100%{opacity:0}}.tr1_1{animation-name:tr1_1;animation-duration:16s}@keyframes tr2_1{0%,36.0%{opacity:0}37.5%,52.5%{opacity:1}54.0%,100%{opacity:0}}.tr2_1{animation-name:tr2_1;animation-duration:16s}@keyframes tr3_1{0%,54.0%{opacity:0}55.5%,70.5%{opacity:1}72.0%,100%{opacity:0}}.tr3_1{animation-name:tr3_1;animation-duration:16s}@keyframes rv4{0%,72.0%{opacity:0}74.0%,97%{opacity:1}100%{opacity:0}}.rv4{animation-name:rv4;animation-duration:16s}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker></defs>
<rect width="100%" height="100%" rx="10" fill="var(--bg)"/>
<text x="20" y="28" class="lg" text-anchor="start" >Toy circuit  x² + x + 5 = out  with x = 3 (secret), out = 17 (public), over F₉₇</text>
<text x="30" y="58" class="t2 sm" text-anchor="start" >row</text>
<text x="80" y="58" class="t2 sm" text-anchor="start" >q_L</text>
<text x="125" y="58" class="t2 sm" text-anchor="start" >q_R</text>
<text x="170" y="58" class="t2 sm" text-anchor="start" >q_O</text>
<text x="215" y="58" class="t2 sm" text-anchor="start" >q_M</text>
<text x="260" y="58" class="t2 sm" text-anchor="start" >q_C</text>
<text x="320" y="58" class="t2 sm" text-anchor="start" >w₀ (L)</text>
<text x="410" y="58" class="t2 sm" text-anchor="start" >w₁ (R)</text>
<text x="500" y="58" class="t2 sm" text-anchor="start" >w₂ (O)</text>
<text x="600" y="58" class="t2 sm" text-anchor="start" >constraint</text>
