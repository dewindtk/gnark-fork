<text x="359" y="91" class="" text-anchor="middle" font-weight="600">17</text>
<text x="359" y="106" class="t2 sm" text-anchor="middle" >out</text>
<rect x="410" y="74" width="78" height="38" rx="5" class="cell"/>
<text x="449" y="91" class="" text-anchor="middle" font-weight="600">17</text>
<text x="449" y="106" class="t2 sm" text-anchor="middle" >out</text>
<rect x="500" y="74" width="78" height="38" rx="5" class="cell"/>
<text x="539" y="91" class="" text-anchor="middle" font-weight="600">17</text>
<text x="539" y="106" class="t2 sm" text-anchor="middle" >out</text>
<text x="600" y="96" class="t2 sm" text-anchor="start" >public: −w₀ + pub₀ = 0</text>
<text x="38" y="148" class="t2" text-anchor="start" >1</text>
<text x="90" y="148" class="" text-anchor="middle" >0</text>
<text x="135" y="148" class="" text-anchor="middle" >0</text>
<text x="180" y="148" class="" text-anchor="middle" >−1</text>
<text x="225" y="148" class="" text-anchor="middle" >1</text>
<text x="270" y="148" class="" text-anchor="middle" >0</text>
<rect x="320" y="126" width="78" height="38" rx="5" class="cell"/>
<text x="359" y="143" class="" text-anchor="middle" font-weight="600">3</text>
<text x="359" y="158" class="t2 sm" text-anchor="middle" >x</text>
<rect x="410" y="126" width="78" height="38" rx="5" class="cell"/>
<text x="449" y="143" class="" text-anchor="middle" font-weight="600">3</text>
<text x="449" y="158" class="t2 sm" text-anchor="middle" >x</text>
<rect x="500" y="126" width="78" height="38" rx="5" class="cell"/>
<text x="539" y="143" class="" text-anchor="middle" font-weight="600">9</text>
<text x="539" y="158" class="t2 sm" text-anchor="middle" >v₁</text>
<text x="600" y="148" class="t2 sm" text-anchor="start" >x·x − v₁ = 0</text>
<text x="38" y="200" class="t2" text-anchor="start" >2</text>
<text x="90" y="200" class="" text-anchor="middle" >1</text>
<text x="135" y="200" class="" text-anchor="middle" >1</text>
<text x="180" y="200" class="" text-anchor="middle" >−1</text>
<text x="225" y="200" class="" text-anchor="middle" >0</text>
<text x="270" y="200" class="" text-anchor="middle" >0</text>
<rect x="320" y="178" width="78" height="38" rx="5" class="cell"/>
<text x="359" y="195" class="" text-anchor="middle" font-weight="600">9</text>
<text x="359" y="210" class="t2 sm" text-anchor="middle" >v₁</text>
<rect x="410" y="178" width="78" height="38" rx="5" class="cell"/>
<text x="449" y="195" class="" text-anchor="middle" font-weight="600">3</text>
<text x="449" y="210" class="t2 sm" text-anchor="middle" >x</text>
<rect x="500" y="178" width="78" height="38" rx="5" class="cell"/>
<text x="539" y="195" class="" text-anchor="middle" font-weight="600">12</text>
<text x="539" y="210" class="t2 sm" text-anchor="middle" >v₂</text>
<text x="600" y="200" class="t2 sm" text-anchor="start" >v₁ + x − v₂ = 0</text>
<text x="38" y="252" class="t2" text-anchor="start" >3</text>
<text x="90" y="252" class="" text-anchor="middle" >1</text>
<text x="135" y="252" class="" text-anchor="middle" >−1</text>
<text x="180" y="252" class="" text-anchor="middle" >0</text>
<text x="225" y="252" class="" text-anchor="middle" >0</text>
<text x="270" y="252" class="" text-anchor="middle" >5</text>
<rect x="320" y="230" width="78" height="38" rx="5" class="cell"/>
<text x="359" y="247" class="" text-anchor="middle" font-weight="600">12</text>
<text x="359" y="262" class="t2 sm" text-anchor="middle" >v₂</text>
<rect x="410" y="230" width="78" height="38" rx="5" class="cell"/>
<text x="449" y="247" class="" text-anchor="middle" font-weight="600">17</text>
<text x="449" y="262" class="t2 sm" text-anchor="middle" >out</text>
<rect x="500" y="230" width="78" height="38" rx="5" class="cell"/>
<text x="539" y="247" class="" text-anchor="middle" font-weight="600">17</text>
<text x="539" y="262" class="t2 sm" text-anchor="middle" >out</text>
<text x="600" y="252" class="t2 sm" text-anchor="start" >v₂ − out + 5 = 0</text>
<g class="tr tr0_1">
<path d="M359,93 Q422.0,70.5 449,93" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M449,93 Q512.0,70.5 539,93" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M539,93 Q551.0,193.5 449,249" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M449,249 Q512.0,226.5 539,249" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M539,249 Q428.0,216.0 359,93" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<text x="30" y="308" class="" text-anchor="start" style="fill:var(--ink)">σ-cycle of out (wire 0):  (w0,0) → (w1,0) → (w2,0) → (w1,3) → (w2,3) → (w0,0)</text>
</g>
<g class="tr tr1_1 keep">
<path d="M359,145 Q422.0,122.5 449,145" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M449,145 Q480.0,171.0 449,197" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M449,197 Q409.0,193.5 359,145" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<text x="30" y="308" class="" text-anchor="start" style="fill:var(--ink)">σ-cycle of x:  (w0,1) → (w1,1) → (w1,2) → (w0,1)</text>
</g>
<g class="tr tr2_1">
<path d="M539,145 Q480.0,216.0 359,197" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M359,197 Q454.0,126.0 539,145" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<text x="30" y="308" class="" text-anchor="start" style="fill:var(--ink)">σ-cycle of v₁:  (w2,1) → (w0,2) → (w2,1)</text>
</g>
<g class="tr tr3_1">
<path d="M539,197 Q480.0,268.0 359,249" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<path d="M359,249 Q454.0,178.0 539,197" fill="none" stroke="var(--s1)" stroke-width="2.2" marker-end="url(#arrA)" stroke-opacity=".9"/>
<text x="30" y="308" class="" text-anchor="start" style="fill:var(--ink)">σ-cycle of v₂:  (w2,2) → (w0,3) → (w2,2)</text>
</g>
<text x="30" y="336" class="t2 sm rv rv4" text-anchor="start" >Copy constraint = "w is constant along every σ-cycle". Position (column j, row i) has label id = j·n + i; σ maps it to the next position of the same variable.</text>
<text x="30" y="354" class="t2 sm rv rv4" text-anchor="start" >Unused R/O cells hold wire 0 (= the first public variable, here out) — gnark's padding convention — so they join out's cycle.</text>
</svg>
