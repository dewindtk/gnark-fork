<rect x="380" y="242.76388888888889" width="44" height="57.23611111111111" rx="4" fill="var(--s1)"/>
<text x="402.0" y="236.76388888888889" class="sm" text-anchor="middle" >129</text>
<text x="402.0" y="316" class="sm" text-anchor="middle" >1/64</text>
<text x="402.0" y="332" class="t2 sm" text-anchor="middle" >512 MiB</text>
<line x1="64" y1="300" x2="442" y2="300" stroke="var(--muted)"/>
<text x="520" y="62" class="sm" text-anchor="start" >folding factor k (bar = proof size, KiB; ρ₀ = 1/8)</text>
<rect x="520" y="184.40277777777777" width="50" height="115.59722222222221" rx="4" fill="var(--s1)"/>
<text x="545.0" y="178.40277777777777" class="sm" text-anchor="middle" >260</text>
<text x="545.0" y="316" class="sm" text-anchor="middle" >k = 2</text>
<text x="545.0" y="332" class="t2 sm" text-anchor="middle" >8 rounds</text>
<rect x="584" y="211.86111111111111" width="50" height="88.13888888888889" rx="4" fill="var(--s1)"/>
<text x="609.0" y="205.86111111111111" class="sm" text-anchor="middle" >198</text>
<text x="609.0" y="316" class="sm" text-anchor="middle" >k = 3</text>
<text x="609.0" y="332" class="t2 sm" text-anchor="middle" >5 rounds</text>
<rect x="648" y="214.69444444444446" width="50" height="85.30555555555556" rx="4" fill="var(--s2)"/>
<text x="673.0" y="208.69444444444446" class="sm" text-anchor="middle" >192</text>
<text x="673.0" y="316" class="sm" text-anchor="middle" >k = 4</text>
<text x="673.0" y="332" class="t2 sm" text-anchor="middle" >3 rounds</text>
<rect x="712" y="195.05555555555554" width="50" height="104.94444444444444" rx="4" fill="var(--s1)"/>
<text x="737.0" y="189.05555555555554" class="sm" text-anchor="middle" >236</text>
<text x="737.0" y="316" class="sm" text-anchor="middle" >k = 5</text>
<text x="737.0" y="332" class="t2 sm" text-anchor="middle" >2 rounds</text>
<rect x="776" y="139.38888888888889" width="50" height="160.61111111111111" rx="4" fill="var(--s1)"/>
<text x="801.0" y="133.38888888888889" class="sm" text-anchor="middle" >361</text>
<text x="801.0" y="316" class="sm" text-anchor="middle" >k = 6</text>
<text x="801.0" y="332" class="t2 sm" text-anchor="middle" >2 rounds</text>
<line x1="514" y1="300" x2="840" y2="300" stroke="var(--muted)"/>
<text x="20" y="366" class="t2 sm" text-anchor="start" >Smaller ρ₀ shrinks the proof but doubles the prover's memory each step; k trades fewer rounds against bigger leaves (16 elements at k = 4).</text>
</svg>
