<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="title desc">
<title id="title">WHIR rounds for the W opening at 2^16 rows (estimate)</title>
<desc id="desc">Log-scale bars: per round the message (chunk length) shrinks 16x while the domain only halves, so the rate drops 8x per round and fewer queries are needed: 90, 44, 29 (estimates, lambda 128, Johnson regime).</desc>
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#9a9993;--grid:#e4e3df;--cell:#f0efec;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--bad:#d03b3b;--good:#0ca30c;--t1:rgba(42,120,214,.16);--t2:rgba(235,104,52,.16)}
@media (prefers-color-scheme:dark){svg{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#77766f;--grid:#383835;
--cell:#262624;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--bad:#e66767;--good:#0ca30c;--t1:rgba(57,135,229,.22);--t2:rgba(217,89,38,.22)}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink);
font-variant-numeric:tabular-nums}
.t2{fill:var(--ink2)} .sm{font-size:11.5px} .lg{font-size:15px;font-weight:600} .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.cell{fill:var(--cell);stroke:var(--grid);stroke-width:1}
.line{stroke:var(--muted);stroke-width:1.2;fill:none} .dash{stroke-dasharray:4 4}
.rv,.tr{animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}
.tr{opacity:0}
@media (prefers-reduced-motion:reduce){svg .rv,svg .tr{animation:none!important}svg .rv{opacity:1}svg .tr{opacity:0}svg .keep{opacity:1}}
@keyframes rv1{0%,18.0%{opacity:0}20.0%,97%{opacity:1}100%{opacity:0}}.rv1{animation-name:rv1;animation-duration:14s}@keyframes rv2{0%,36.0%{opacity:0}38.0%,97%{opacity:1}100%{opacity:0}}.rv2{animation-name:rv2;animation-duration:14s}@keyframes rv3{0%,54.0%{opacity:0}56.0%,97%{opacity:1}100%{opacity:0}}.rv3{animation-name:rv3;animation-duration:14s}@keyframes rv4{0%,72.0%{opacity:0}74.0%,97%{opacity:1}100%{opacity:0}}.rv4{animation-name:rv4;animation-duration:14s}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker></defs>
<rect width="100%" height="100%" rx="10" fill="var(--bg)"/>
<text x="20" y="28" class="lg" text-anchor="start" >Why later WHIR rounds are cheap: W opening at 2¹⁶ rows (m = 18, k = 4, ρ₀ = 1/8)</text>
<line x1="190" y1="76" x2="190" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="190" y="300" class="t2 sm" text-anchor="middle" >2^0</text>
<line x1="250" y1="76" x2="250" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="250" y="300" class="t2 sm" text-anchor="middle" >2^2</text>
<line x1="310" y1="76" x2="310" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="310" y="300" class="t2 sm" text-anchor="middle" >2^4</text>
<line x1="370" y1="76" x2="370" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="370" y="300" class="t2 sm" text-anchor="middle" >2^6</text>
<line x1="430" y1="76" x2="430" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="430" y="300" class="t2 sm" text-anchor="middle" >2^8</text>
<line x1="490" y1="76" x2="490" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="490" y="300" class="t2 sm" text-anchor="middle" >2^10</text>
<line x1="550" y1="76" x2="550" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="550" y="300" class="t2 sm" text-anchor="middle" >2^12</text>
<line x1="610" y1="76" x2="610" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="610" y="300" class="t2 sm" text-anchor="middle" >2^14</text>
<line x1="670" y1="76" x2="670" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="670" y="300" class="t2 sm" text-anchor="middle" >2^16</text>
<line x1="730" y1="76" x2="730" y2="284" stroke="var(--grid)" stroke-width="1"/>
<text x="730" y="300" class="t2 sm" text-anchor="middle" >2^18</text>
<text x="460" y="318" class="t2 sm" text-anchor="middle" >size (log₂ scale)</text>
<g class="">
<text x="20" y="104" class="" text-anchor="start" >round 0: table 2^18</text>
<text x="20" y="121" class="t2 sm" text-anchor="start" >rate 2^-3,  90 queries</text>
<rect x="190" y="90" width="510" height="16" rx="4" fill="var(--s2)"/>
<rect x="190" y="110" width="420" height="16" rx="4" fill="var(--s1)"/>
<text x="706" y="103" class="sm" text-anchor="start" >codeword 2^17</text>
<text x="616" y="123" class="sm" text-anchor="start" >chunk (message) 2^14</text>
</g>
<g class="rv rv1">
<text x="20" y="166" class="" text-anchor="start" >round 1: table 2^14</text>
<text x="20" y="183" class="t2 sm" text-anchor="start" >rate 2^-6,  44 queries</text>
<rect x="190" y="152" width="480" height="16" rx="4" fill="var(--s2)"/>
<rect x="190" y="172" width="300" height="16" rx="4" fill="var(--s1)"/>
<text x="676" y="165" class="sm" text-anchor="start" >codeword 2^16</text>
<text x="496" y="185" class="sm" text-anchor="start" >chunk (message) 2^10</text>
</g>
<g class="rv rv2">
<text x="20" y="228" class="" text-anchor="start" >round 2: table 2^10</text>
<text x="20" y="245" class="t2 sm" text-anchor="start" >rate 2^-9,  29 queries</text>
<rect x="190" y="214" width="450" height="16" rx="4" fill="var(--s2)"/>
<rect x="190" y="234" width="180" height="16" rx="4" fill="var(--s1)"/>
<text x="646" y="227" class="sm" text-anchor="start" >codeword 2^15</text>
<text x="376" y="247" class="sm" text-anchor="start" >chunk (message) 2^6</text>
</g>
<text x="20" y="270" class="sm rv rv3" text-anchor="start" >base case: 2⁶ = 64 values sent</text>
<text x="20" y="342" class="t2 sm rv rv4" text-anchor="start" >Each round: k = 4 sumcheck rounds shrink the table 16×, the new codeword's domain only halves → rate falls 8× → each query is worth more bits.</text>
<text x="20" y="360" class="t2 sm rv rv4" text-anchor="start" >Query counts are estimates (λ = 128, Johnson regime); the real table comes from whirparams (M0b).</text>
<rect x="20" y="44" width="12" height="12" rx="3" fill="var(--s2)"/>
<text x="38" y="54" class="sm" text-anchor="start" >codeword (evaluation domain)</text>
<rect x="240" y="44" width="12" height="12" rx="3" fill="var(--s1)"/>
<text x="258" y="54" class="sm" text-anchor="start" >message chunk (2^(m−k) coefficients)</text>
</svg>
